<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>App</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="apps.css">
<link rel="stylesheet" href="tabbar.css">
<link rel="stylesheet" href="edit-drag.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="wechat.css">
</head>
<body>

<div class="app-shell">
  <div class="page-container" id="pageContainer">

    <button class="reset-layout-btn" id="resetLayoutBtn">
      <svg viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M3 21v-5h5"/>
      </svg>
      <span>恢复初始</span>
    </button>

    <!-- ========================================== -->
    <!-- 桌面 (Home) -->
    <!-- ========================================== -->
    <div class="page active" data-page="home">

      <div class="profile-card draggable" id="profileCard" data-component="card">
        <div class="card-bg" id="cardBg"></div>
        <div class="card-upper" id="cardUpper"></div>
        <div class="card-lower">
          <div class="lower-overlay" id="lowerOverlay"></div>
          <div class="avatar-wrapper" id="avatarBtn">
            <img id="avatarImg" alt="头像">
            <svg class="avatar-placeholder" viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </div>
          <div class="info-area">
            <div class="info-text line-1" contenteditable="true" data-key="line1" data-placeholder="姓名"></div>
            <div class="info-text line-2" contenteditable="true" data-key="line2" data-placeholder="身份/称号"></div>
            <div class="info-text line-3" contenteditable="true" data-key="line3" data-placeholder="签名/心情"></div>
            <div class="info-text line-4">
              <svg class="location-icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span class="location-text" contenteditable="true"></span>
            </div>
          </div>
        </div>
        <button class="edit-btn" data-edit-target="card">编辑</button>
      </div>

      <div class="message-card draggable" id="messageCard" data-component="message">
        <div class="message-avatar" id="messageAvatar">
          <img id="messageAvatarImg" alt="角色头像">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        </div>
        <div class="message-content">
          <div class="message-preview" id="messagePreview" contenteditable="true">暂无消息...</div>
        </div>
        <div class="message-badge">
          <svg class="badge-icon" viewBox="0 0 20 22">
            <path d="M4 2 L16 2 Q18 2 18 4 L18 12 Q18 14 16 14 L11 14 L10 17 L9 14 L4 14 Q2 14 2 12 L2 4 Q2 2 4 2 Z" 
                  stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="8" r="1" fill="currentColor"/>
            <circle cx="10" cy="8" r="1" fill="currentColor"/>
            <circle cx="14" cy="8" r="1" fill="currentColor"/>
          </svg>
          <span id="messageBadgeText">new message</span>
        </div>
      </div>

      <!-- 展示区 -->
      <div class="couple-section draggable" id="coupleSection" data-component="couple">
        <div class="couple-bubbles">
          <div class="couple-bubble" contenteditable="true" id="coupleBubble1">在想你...</div>
          <div class="couple-bubble" contenteditable="true" id="coupleBubble2">我也是 ♡</div>
        </div>
        <div class="couple-avatars">
          <div class="couple-avatar-item">
            <div class="couple-speech" contenteditable="true" id="coupleSpeech1">♡</div>
            <div class="couple-avatar-circle" id="coupleAvatar1">
              <img id="coupleAvatarImg1" alt="">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            </div>
            <div class="couple-name" contenteditable="true" id="coupleName1">TA</div>
          </div>
          <div class="couple-avatar-item">
            <div class="couple-speech" contenteditable="true" id="coupleSpeech2">♡</div>
            <div class="couple-avatar-circle" id="coupleAvatar2">
              <img id="coupleAvatarImg2" alt="">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            </div>
            <div class="couple-name" contenteditable="true" id="coupleName2">我</div>
          </div>
        </div>
      </div>

    </div>

    <!-- ========================================== -->
    <!-- App 空壳页面 (内部全部由 JS 自动渲染填入) -->
    <!-- ========================================== -->
    <div class="page app-page" data-page="wechat"></div>
    <div class="page app-page" data-page="offline"></div>
    <div class="page app-page" data-page="settings"></div>
    <div class="page app-page" data-page="check"></div>

  </div>

  <!-- 底部栏编辑按钮 -->
  <button class="edit-btn tabbar-edit-btn" data-edit-target="tabbar">编辑</button>

  <!-- 桌面 Dock 栏 -->
  <div class="tab-bar">
    <div class="tab-bar-capsule">
      <div class="tab-item" data-tab="wechat">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.5 11c2.8 0 5 1.7 5 3.8 0 1.4-1 2.6-2.5 3.3l.3 2-1.8-1.1c-.5.1-1.1.2-1.7.2-2.8 0-5-1.7-5-3.8 0-.2 0-.5.1-.7"/>
            <path d="M9 3.5C5 3.5 2 6 2 9c0 1.7 1 3.2 2.7 4.3L4 16l2.8-1.4c.7.2 1.5.3 2.2.3 4 0 7-2.5 7-5.5S13 3.5 9 3.5z" fill="white"/>
          </svg>
        </div>
        <div class="tab-label">微信</div>
      </div>
      <div class="tab-item" data-tab="offline">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="tab-label">线下</div>
      </div>
      <div class="tab-item" data-tab="settings">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1.08 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1.08z"/>
          </svg>
        </div>
        <div class="tab-label">设置</div>
      </div>
      <div class="tab-item" data-tab="check">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24">
            <rect x="5" y="2" width="14" height="20" rx="3" ry="3"/>
            <path d="M12 18h.01"/>
            <path d="M9 6h6"/>
          </svg>
        </div>
        <div class="tab-label">查岗</div>
      </div>
    </div>
  </div>
</div>

<!-- 裁剪器 -->
<div class="crop-overlay" id="cropOverlay">
  <div class="crop-container">
    <div class="crop-header">
      <button class="crop-cancel" id="cropCancelBtn" type="button">取消</button>
      <span>裁剪图片</span>
      <button class="crop-confirm" id="cropConfirmBtn" type="button">确定</button>
    </div>
    <div class="crop-toolbar">
      <button class="crop-ratio-btn active" data-ratio="free" type="button">自由</button>
      <button class="crop-ratio-btn" data-ratio="1" type="button">1:1</button>
      <button class="crop-ratio-btn" data-ratio="4:3" type="button">4:3</button>
      <button class="crop-ratio-btn" data-ratio="16:9" type="button">16:9</button>
    </div>
    <div class="crop-workspace" id="cropWorkspace">
      <canvas id="cropCanvas"></canvas>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="components.js"></script>
<script src="edit-drag.js"></script>
<script src="tabbar.js"></script>
<script src="settings.js"></script>
<script src="wechat.js"></script>
</body>
</html>
